      - name: glossary_sl
        label: Glossary
        type: file
        path: src/data/glossary.json
        format: json
        operations:
          create: false
          delete: false
        fields:
          - name: sl
            label: Slovene glossary
            type: object
            list: true
            fields:
              - name: term
                label: Term
                type: string
                required: true
              - name: definition
                label: Definition
                type: text
                required: true
              - name: forms
                label: Word forms
                description: Additional inflected forms found in the chapters (plurals, cases). Leave empty to match the term itself.
                type: string
                list: true

      - name: pages_sl
        label: Pages
        type: collection
        path: src/content/pages/sl
        format: yaml-frontmatter
        filename:
          template: "{primary}.mdx"
          field: create
        view:
          primary: title
        fields:
          - name: title
            type: string
            required: true
          - name: lang
            component: language
          - name: template
            component: page_template
          - name: openerImage
            label: Opener image
            type: image
            options:
              media: book_images
              path: src/assets/book
          - name: openerImageAlt
            label: Opener image alt text
            type: text
          - name: body
            component: markdown_body
            options:
              media: site_images
              path: src/assets/site
              rename: safe

      - name: chapters_sl
        label: Chapters
        type: collection
        path: src/content/book/sl
        format: yaml-frontmatter
        filename:
          template: "{primary}.mdx"
          field: create
        view:
          primary: title
        fields:
          - name: title
            label: Page title
            type: string
            required: true
          - name: lang
            component: language
          - name: template
            component: book_template
          - name: body
            component: markdown_body
            options:
              media: book_images
              path: src/assets/book
              rename: safe

  - name: brand_guide
    label: Brand Guide
    type: file
    path: design/brand-guide.mdx
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
        readonly: true
      - name: lang
        component: language
        readonly: true
      - name: body
        component: markdown_body
        description: "Published at https://toolbox.wirmachen.wien/brand. The complete guide, including all live component examples. The Colors section is generated; update design/colors.json and run npm run colors:generate instead of editing that section here."
    operations:
      create: false
      delete: false
