name: CI

# Pull requests only: build everything, run the checks and attach the
# generated handbook files for review. Deploying is deploy.yml's job.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_design_validation:
        description: Run full design and motion validation
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Validate committed design assets and prepare previews
        uses: ./.github/actions/design
        with:
          force-full: ${{ inputs.full_design_validation || false }}

      - name: Compute handbook export cache key
        id: export-cache
        shell: bash
        run: |
          toolchain="$(python3 -V; python3 -m pip freeze | LC_ALL=C sort; node --version)"
          echo "toolchain=$(printf '%s' "$toolchain" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore handbook export cache
        uses: actions/cache@v4
        with:
          path: design/.cache/downloads
          key: handbook-exports-${{ runner.os }}-${{ github.event_name == 'pull_request' && 'pr' || 'prod' }}-${{ steps.export-cache.outputs.toolchain }}-${{ hashFiles('src/content/book/**', 'src/content/pages/**', 'src/data/**', 'src/assets/**', 'src/styles/**', 'scripts/handbook/**', 'scripts/bin/build-pdf.py', 'scripts/bin/build-epub.py', 'scripts/bin/build-downloads.mjs', 'scripts/bin/drawn-paths.mjs', 'scripts/bin/render-math.mjs', 'design/elements/**', 'design/colors.json', 'handbook.config.ts', 'package-lock.json', 'requirements.txt', 'design/requirements.txt') }}
          restore-keys: |
            handbook-exports-${{ runner.os }}-${{ github.event_name == 'pull_request' && 'pr' || 'prod' }}-

      - name: Check color registry, generated outputs and contrast
        run: npm run colors:check && node --test scripts/tests/colors.test.mjs

      - name: Check derived config files are in sync
        run: npm run check:config

      - name: Check theme behavior without a browser
        run: node --test scripts/tests/theme.test.mjs

      - name: Check bookmark behavior and titles
        run: node --test scripts/tests/bookmark*.test.mjs

      - name: Check popup positioning and footnote navigation
        run: node --test scripts/tests/content-popup.test.mjs scripts/tests/footnote-popups.test.mjs

      - name: Build static site, PDFs, EPUBs and search index
        run: npm run build

      - name: Check translations, links, sitemap and search index
        run: npm run check:site

      - name: Check glossary term coverage and dictionary sync
        run: npm run check:glossary

      - name: Upload handbook downloads
        uses: actions/upload-artifact@v4
        with:
          name: handbook-downloads
          path: dist/downloads/
