name: CI

# Pull requests only: build everything, run the checks and attach the
# generated handbook files for review. Deploying is deploy.yml's job.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Validate and package committed design assets
        uses: ./.github/actions/design

      - name: Check derived config files are in sync
        run: npm run check:config

      - name: Check theme behavior without a browser
        run: node --test scripts/tests/theme.test.mjs

      - name: Build static site, PDFs, EPUBs and search index
        run: npm run build

      - name: Check translations, links, sitemap and search index
        run: npm run check:site

      - name: Check glossary term coverage and dictionary sync
        run: npm run check:glossary

      - name: Upload handbook downloads
        uses: actions/upload-artifact@v4
        with:
          name: handbook-downloads
          path: dist/downloads/
