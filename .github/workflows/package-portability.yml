name: Brand package portability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package contract (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test portable packaging with synthetic fixtures only
        run: python -m unittest discover -s design/tests -p test_package_contract.py
      - name: Record full inventory and archive identities
        run: python design/tests/test_package_contract.py --write-result portability.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-contract-${{ runner.os }}
          path: portability.json

  compare:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-contract-*
          path: package-results
      - name: Require identical Windows and Linux package bytes and fingerprints
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          results = sorted(Path("package-results").glob("*/portability.json"))
          assert len(results) == 2, "Missing platform result"
          values = [json.loads(path.read_text(encoding="utf-8")) for path in results]
          assert values[0] == values[1], "Brand package contract differs across platforms"
          print("Windows and Linux inventory fingerprints, member order and ZIP bytes match.")
          PY
