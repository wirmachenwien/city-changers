name: Validate committed design assets
description: Check committed artwork freshness and package the brand kit without regenerating assets
runs:
  using: composite
  steps:
    - name: Check committed asset freshness
      shell: bash
      run: npm run design:check

    - name: Install pinned design image tools
      shell: bash
      run: pip install -r design/requirements.txt

    - name: Package committed assets for website downloads
      shell: bash
      run: npm run design:prepare

    - name: Check editable motion sources
      shell: bash
      run: |
        if [ ! -d design/motion/node_modules ]; then
          npm ci --prefix design/motion
        fi
        npm run lint --prefix design/motion
        npm run check:motion --prefix design/motion

    - name: Validate design assets and release inventory
      shell: bash
      run: |
        python3 -m unittest discover -s design/tests -v
        python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

    - name: Ensure validation and packaging did not change tracked assets
      shell: bash
      run: git diff --exit-code -- design src/assets public

    - name: Upload generated brand kit for review
      uses: actions/upload-artifact@v4
      with:
        name: city-changers-brand-kit
        path: public/brand-assets/city-changers-brand-kit.zip
        if-no-files-found: error
